services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: examen_sqlserver
    restart: unless-stopped
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Examen2026*Celulares
    ports:
      - "${SQL_PORT:-14333}:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Examen2026*Celulares' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: examen_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./03. BDD:/scripts:ro
    entrypoint: >
      bash -c "
        echo 'Conectando con SQL Server para inicializar bases y datos...'
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Examen2026*Celulares' -C -i /scripts/01_CrearBases.sql
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Examen2026*Celulares' -C -i /scripts/02_DatosPrueba.sql
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Examen2026*Celulares' -C -i /scripts/03_MigrarImagenes.sql
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Examen2026*Celulares' -C -i /scripts/BanQuito_01_CrearBase.sql
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Examen2026*Celulares' -C -i /scripts/BanQuito_02_DatosPrueba.sql
        echo '¡Bases de datos ComercializadoraCelulares y BanQuitoCore inicializadas con éxito!'
      "

  banquito-api:
    build:
      context: .
      dockerfile: 04. SERVIDOR/BanQuito.Api/Dockerfile
    container_name: examen_banquito_api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - URLS=http://0.0.0.0:19101
      - ConnectionStrings__BaseDatos=Server=sqlserver,1433;Database=BanQuitoCore;User Id=sa;Password=Examen2026*Celulares;TrustServerCertificate=True
    ports:
      - "19101:19101"

  comercializadora-api:
    build:
      context: .
      dockerfile: 04. SERVIDOR/Comercializadora.Api/Dockerfile
    container_name: examen_comercializadora_api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      banquito-api:
        condition: service_started
    environment:
      - URLS=http://0.0.0.0:19102
      - ConnectionStrings__BaseDatos=Server=sqlserver,1433;Database=ComercializadoraCelulares;User Id=sa;Password=Examen2026*Celulares;TrustServerCertificate=True
      - Servicios__BanQuitoUrl=http://banquito-api:19101/
    ports:
      - "19102:19102"

  celulares-web:
    build:
      context: .
      dockerfile: 04. CLIWEB/Celulares.Web/Dockerfile
    container_name: examen_celulares_web
    restart: unless-stopped
    depends_on:
      comercializadora-api:
        condition: service_started
    environment:
      - URLS=http://0.0.0.0:19103
      - CelularesApiUrl=http://comercializadora-api:19102/
    ports:
      - "19103:19103"

volumes:
  mssql_data:
